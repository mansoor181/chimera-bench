# Shared configuration for all CHIMERA baselines.
# Individual baseline configs inherit these values.
# Override per-baseline by setting the same key in the baseline's config.yaml.

paths:
  data_root: /home/exouser/data/chimera
  trans_baselines: /home/exouser/data/chimera/trans_baselines
  # results_root: /media/volume/data2/chimera/results
  results_root: /media/volume/data2/chimera/results

splits:
  available:
    - epitope_group
    - antigen_fold
    - temporal
  default: epitope_group

evaluation:
  contact_cutoff: 4.5
  metric_keys:
    - aar
    - caar
    - ppl
    - rmsd
    - tm_score
    - fnat
    - irmsd
    - dockq
    - epitope_precision
    - epitope_recall
    - epitope_f1
    - n_liabilities
    - chimera_s
    - chimera_b

wandb:
  enabled: true
